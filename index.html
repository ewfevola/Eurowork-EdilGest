<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestionale EUROWORK</title>
<meta name="theme-color" content="#1f2c31">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d4121a'/%3E%3Cpath d='M6 12h20M6 18h20' stroke='%23fff' stroke-width='3.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('tema');if(t)document.documentElement.dataset.tema=t}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="vista-config" class="accesso" hidden>
  <div class="marchio"><i aria-hidden="true"></i>EUROWORK</div>
  <p class="errore" style="margin-top:20px">Manca la configurazione.</p>
  <p class="nota">Apri il file config.js e incolla l'indirizzo e la chiave del progetto Supabase, come spiegato nella guida.</p>
</div>

<div id="vista-accesso" class="accesso" hidden>
  <div class="marchio"><i aria-hidden="true"></i>EUROWORK</div>
  <p class="nota">Gestionale interno</p>
  <form id="form-accesso">
    <div><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <p id="errore-accesso" class="errore" role="alert" hidden></p>
    <button class="btn rosso" type="submit">Accedi</button>
  </form>
</div>

<div id="vista-app" class="app" hidden>
  <div class="cima-mobile">
    <span class="marchio" style="color:#fff"><i aria-hidden="true"></i>EUROWORK</span>
    <button id="apri-menu" aria-controls="laterale" aria-expanded="false">Menu</button>
  </div>
  <nav class="laterale" id="laterale" aria-label="Menu principale">
    <a class="marchio" href="#"><i aria-hidden="true"></i>EUROWORK <span>Gestionale</span></a>
    <ul class="menu-voci" id="menu-voci"></ul>
    <div class="profilo-utente"><b id="nome-utente"></b><span id="ruolo-utente"></span>
      <div class="riga-utente"><div class="tema" role="group" aria-label="Aspetto"><button type="button" data-tema="chiaro">Chiaro</button><button type="button" data-tema="scuro">Scuro</button><button type="button" data-tema="">Auto</button></div><button id="esci">Esci</button></div></div>
  </nav>
  <main class="contenuto" id="contenuto" tabindex="-1"></main>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/comune.js"></script>
<script src="js/moduli/home.js"></script>
<script src="js/moduli/cantieri.js"></script>
<script src="js/moduli/presenze.js"></script>
<script src="js/moduli/giornale.js"></script>
<script src="js/moduli/personale.js"></script>
<script src="js/moduli/scadenze.js"></script>
<script src="js/moduli/preventivi.js"></script>
<script src="js/moduli/contabilita.js"></script>
<script src="js/moduli/costifissi.js"></script>
<script src="js/moduli/documenti.js"></script>
<script src="js/moduli/anagrafiche.js"></script>
<script src="js/app.js"></script>
</body>
</html>
